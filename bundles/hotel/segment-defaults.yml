# 三客群默认安装清单（v2.1 新增；§2.2 槽⑤班组装配的客群化默认配置；v3.3 获客域并入）
# 用途：新工作区按客群一键初始化——预装技能（ordered：首屏展示顺序=销售叙事顺序）、启用 preset、默认触发器、围栏 patch。
# 纪律：清单只决定「默认装什么、什么前置」，运行时仍全量过围栏瀑布（L8.3）；客户后续可自助加装技能市场任意技能。
# v3.3：获客组（ai-receptionist/coupon-operator/guest-success/channel-watcher + 4 获客技能）并入三客群——
#       民宿获客技能紧随 content-marketing 前置（种草是命脉），其余客群接在 ai-live-assistant 之后。
version: hotel-segment-defaults/v1
segments:
  low_star_single:
    label: 低星单体酒店
    pitch: 一年省 17 万，一个月回本
    fence_patch: fences/patches/low-star-single-patch.yml
    presets:
    - pricing-agent
    - review-agent
    - reconcile-agent
    - inspection-agent
    - frontdesk-agent
    - content-agent
    - competitor-agent
    - desktop-agent
    - phone-agent
    - ai-receptionist
    - coupon-operator
    - guest-success
    - channel-watcher
    skills_ordered:
    - night-audit-suite
    - revenue-manager
    - pricing-matrix
    - channel-reconciler
    - overbooking-parity-guard
    - review-crisis
    - review-asset-mining
    - ota-operations
    - checkin-checkout
    - customer-service
    - morning-briefing
    - handover-manager
    - inspection-suite
    - room-service-dispatch
    - staff-scheduler
    - inventory-procurement
    - finance-reporting
    - retention-manager
    - guest-profile-crm
    - maintenance-dispatch
    - safety-compliance
    - phone-concierge
    - content-marketing
    - ai-live-assistant
    - lead-concierge
    - coupon-ops
    - hotel-geo-content
    - intent-radar
    - incident-postmortem
    triggers_enabled:
    - tg-inspection-0700
    - tg-night-2200
    - tg-review-sla-30min
    - tg-parity-15min
