# 社媒×GEO 双域融合经营基线围栏包（融合方案 v1.0 §2.4：双域合计 12 条基线，全部只可加严）
# 单调守卫（F2.3）：is_baseline=true 的规则，任何上层 patch 只可收紧不可放宽
# DSL 求值语义：match 命中后求值 when 表达式（沙箱，禁任意代码）；
#   命中 → 按 level 判定；block 优先于 review 优先于 auto（deny 优先并集求值）；
#   写类动作无任何规则命中 → 按 default_level 处理；求值异常 → 按 block（宁可错杀）
# 三大纪律：① GEO 灰帽零容忍（G-GEO3 熔断）；② 事实红线一票否决（G-GEO2）；③ 涉人设/品牌表态强制 L4（G20）
version: geo-growth-baseline/v1
default_level: review
rules:
  # ---- 社媒域（沿用 ai-video 基线口径，双域版重声明） ----
  - rule_id: G9
    name: 公网发布必审
    level: review
    is_baseline: true
    match:
      object_types: [publish_task]
      actions: [publish.execute]
    when: "true"
    note: 社媒多平台发布必审（G9 系列纪律之首）

  - rule_id: G9a
    name: 新平台首发必审
    level: review
    is_baseline: true
    match:
      object_types: [publish_task]
      actions: [publish.execute]
    when: "context.platform_first_use == true"
    note: 某账号在某平台首次发布必审，与 G9 并集取严

  - rule_id: G9b
    name: 单账号日发布超限熔断
    level: block
    is_baseline: true
    match:
      object_types: [publish_task]
      actions: [publish.execute]
    when: "context.account_daily_published >= 5"
    note: 单账号日发布上限 5 条，超限熔断+告警（RPA 风控纪律）

  - rule_id: G10a
    name: 夸赞/感谢类评论回复自动
    level: auto
    is_baseline: true
    match:
      object_types: [comment_reply]
      actions: [comment.reply]
    when: "params.intent in ['praise', 'thanks']"
    note: 评论四档分流一档：夸赞/感谢自动回（模板库内措辞）

  - rule_id: G10b
    name: 咨询/售后类评论回复必审
    level: review
    is_baseline: true
    match:
      object_types: [comment_reply]
      actions: [comment.reply]
    when: "params.intent in ['consult', 'after_sale']"
    note: 评论四档分流二档：咨询/售后 review，可转人工

  - rule_id: G10c
    name: 负面/投诉/维权类评论回复必审+告警
    level: review
    is_baseline: true
    match:
      object_types: [comment_reply]
      actions: [comment.reply]
    when: "params.intent in ['negative', 'crisis'] or contains_any(params.text, ['投诉', '维权', '退款', '骗子', '举报'])"
    note: 评论四档分流三档：负面/危机 review 并触发告警；涉人设回应升级 G20

  - rule_id: G10d
    name: 敏感内容评论回复禁止
    level: block
    is_baseline: true
    match:
      object_types: [comment_reply]
      actions: [comment.reply]
    when: "params.intent == 'sensitive'"
    note: 评论四档分流四档：敏感内容 block，只写「需介入」事件，不自动外发

  - rule_id: G12
    name: 投放加投必审
    level: review
    is_baseline: true
    match:
      object_types: [ads_campaign]
      actions: [ads.boost]
    when: "true"
    note: 任何追加投流预算动作必审（涉预算纪律，不可降级为 auto）

  - rule_id: G15
    name: 对外商务文件必审
    level: review
    is_baseline: true
    match:
      object_types: [commercial_doc, deal_order]
      actions: [doc.send_external, deal.send_external]
    when: "params.doc_type in ['quote', 'closure_report', 'commitment', 'contract']"
    note: 报价/结案/承诺/合同等对外商务文件必审后外发（私域域），不得自动发送

  - rule_id: G16
    name: 矩阵账号异常登录与防关联违规
    level: block
    is_baseline: true
    match:
      object_types: [account_metric]
      actions: [account.login, account.session_bind]
    when: "context.login_anomaly == true or context.association_risk == true"
    note: 出海刚需：异常登录（异地/新设备/频繁切换）或防关联违规（共用环境/批量同频操作）直接阻断并挂起该账号全部自动动作

  # ---- GEO 域（新增） ----
  - rule_id: G-GEO1
    name: GEO 内容外发必审
    level: review
    is_baseline: true
    match:
      object_types: [geo_content]
      actions: [geo.publish]
    when: "true"
    note: AI 答案版内容（问答式/清单式/对比式）外发知乎/百科/新闻源/垂媒/公众号前必审；社媒审传播力、GEO 审事实与结构，双审制不省

  - rule_id: G-GEO2
    name: 事实红线一票否决
    level: block
    is_baseline: true
    match:
      object_types: [geo_content, script_package, platform_variant]
      actions: [content.submit, geo.publish]
    when: "context.fact_check_passed != true"
    note: ProductTruthChecker：宣称不得超出官方口径、创意前提与产品真实使用前提必须自洽、品牌实体信息与实体卡逐字一致；任一不符一票否决，双域通用

  - rule_id: G-GEO3
    name: GEO 灰帽手段熔断
    level: block
    is_baseline: true
    match:
      object_types: [geo_content, citation_source]
      actions: [geo.publish, source.submit, geo.boost]
    when: "params.technique in ['corpus_pollution', 'fake_multi_source', 'machine_seeding', 'mass_ai_spam']"
    note: 灰帽零容忍：语料污染/伪造多源/机器刷量/批量 AI 垃圾内容命中即熔断+告警；我们承诺「可测量可追溯」，不承诺「保证上榜」

  - rule_id: G-GEO4
    name: 单账号信源日发超限熔断
    level: block
    is_baseline: true
    match:
      object_types: [source_task]
      actions: [geo.publish]
    when: "context.account_daily_source_published >= 3"
    note: 信源组对称 G9b 纪律：单账号信源平台日发上限 3 条（信源平台对批量发帖更敏感），超限熔断+告警；宪章 geo_publish_per_day_cap 为其上限来源

  # ---- 双域通用 ----
  - rule_id: G20
    name: 涉人设/品牌表态内容强制 L4 人审
    level: block
    is_baseline: true
    match:
      object_types: [geo_content, comment_reply, publish_task]
      actions: [content.submit, comment.reply, publish.execute]
    when: "params.involves_persona == true or params.involves_brand_stance == true"
    note: 涉人设/品牌表态内容阻断一切自动外发，强制 L4 人审后由人执行；AI 不替客户做人格化承诺

  - rule_id: G17
    name: 自治边界放宽必须 L4（只紧不松）
    level: block
    is_baseline: true
    match:
      object_types: [fence_rule]
      actions: [fence.relax, charter.relax]
    when: "context.l4_approved != true"
    note: 围栏/宪章任何放宽未经 L4 批准即阻断；收紧方向不受限（单调守卫）

  - rule_id: G18
    name: 熔断触发即时通知+边界快照
    level: auto
    is_baseline: true
    match:
      object_types: [circuit_breaker]
      actions: [breaker.trigger]
    when: "true"
    note: 任何熔断触发自动执行三件套：即时通知决策人、生成边界快照、事件链留痕；不得静默熔断
