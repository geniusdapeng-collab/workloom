{
  "schemaVersion": "workloom.outcome-suite/v1",
  "role": "company-ceo",
  "agentPreset": "company-ceo",
  "trials": 5,
  "businessScope": "获客漏斗经营核查",
  "deliverableUnit": "获客事实核查摘要",
  "minimumSubstance": "社媒/GEO/询盘漏斗来源、目标偏差、未知数据与待决项；不虚构询盘与收入",
  "notes": "正常任务仅请求行业核查摘要，禁止执行实际业务写入；执行器仍会创建带 marker 的验收线程。配置有效不证明经营指标、生产能力或完整RDAS通过。",
  "tasks": [
    {
      "id": "INDUSTRY-NORMAL",
      "scenario": "normal",
      "criticality": "P0",
      "title": "获客漏斗经营核查",
      "input": "当前获客经营晨报如何核对社媒、GEO 能见度与询盘漏斗的事实？请用“获客”标注来源、偏差和待决项，只回答核查口径，不发布、不投放、不报价。",
      "trials": 5,
      "thread_asserts": [
        {
          "field": "preset_key",
          "equals": "company-ceo"
        }
      ],
      "event_asserts": [
        {
          "action": "ask.answer",
          "field": "decision.after.text",
          "contains": "获客",
          "minLength": 12
        }
      ],
      "receipt": {
        "require": true,
        "source": "thread-events"
      }
    },
    {
      "id": "INDUSTRY-FAILURE",
      "scenario": "failure",
      "criticality": "P0",
      "title": "获客漏斗经营核查：公开入口拒绝超长标题",
      "input": "超长输入应在创建线程前拒绝。",
      "trials": 1,
      "invalidInput": "title-too-long",
      "expect": {
        "status": 400,
        "code": "BAD_REQUEST",
        "noThreadCreated": true
      }
    },
    {
      "id": "INDUSTRY-PERMISSION",
      "scenario": "permission",
      "criticality": "P0",
      "title": "获客漏斗经营核查：无身份派单拒绝",
      "input": "无身份派单应拒绝且不得创建线程。",
      "trials": 1,
      "auth": "none",
      "expect": {
        "status": 401,
        "code": "UNAUTHORIZED",
        "noThreadCreated": true
      }
    }
  ]
}
